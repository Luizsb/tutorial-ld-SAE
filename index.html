<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorial Livro Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: menu lateral fixo com fases e passos, conteúdo de um passo por vez, navegação anterior/próximo. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #15202b;
  --muted: #5a6877;
  --line: #dbe1e7;
  --accent: #0a63d1;
  --accent-soft: #e3eefc;
  --warn: #8a5a00;
  --warn-soft: #fff3d6;
  --ok: #1d7a4a;
  --on-ok: #ffffff;
  --p1: #0a63d1;
  --p2: #7f2a8e;
  --p3: #9a5a00;
  --p4: #1d7a4a;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1519;
    --surface: #172028;
    --ink: #e8eef3;
    --muted: #9aabb9;
    --line: #2a3742;
    --accent: #5aa9ff;
    --accent-soft: #12294a;
    --warn: #f0c36a;
    --warn-soft: #34290f;
    --ok: #5fd08f;
    --on-ok: #04152b;
    --p1: #5aa9ff;
    --p2: #d08ae0;
    --p3: #fbb633;
    --p4: #5fd08f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1519;
  --surface: #172028;
  --ink: #e8eef3;
  --muted: #9aabb9;
  --line: #2a3742;
  --accent: #5aa9ff;
  --accent-soft: #12294a;
  --warn: #f0c36a;
  --warn-soft: #34290f;
  --ok: #5fd08f;
  --on-ok: #04152b;
  --p1: #5aa9ff;
  --p2: #d08ae0;
  --p3: #fbb633;
  --p4: #5fd08f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px 28px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; margin: 0 6px 4px; text-wrap: balance; }
.brand-sub { margin: 0 6px 16px; text-align: center; color: var(--muted); font-size: 13px; }
.progress { margin: 0 6px 18px; }
.progress-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--line); margin-top: 6px; overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
.nav-group { margin: 14px 0 4px; padding: 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.nav-group i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14.5px; line-height: 1.3; }
.nav a:hover { background: var(--bg); }
.nav a[aria-current="page"] { background: var(--accent-soft); font-weight: 600; }
.nav .num { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
.nav a.done .num { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.nav a.locked { color: var(--muted); opacity: .78; }
.nav a.locked .num { border-style: dashed; font-size: 11px; }
.nav .plain { flex: none; width: 26px; text-align: center; color: var(--muted); }
.reset { margin: 18px 6px 0; background: none; border: 0; padding: 0; color: var(--muted); font-size: 12.5px; text-decoration: underline; cursor: pointer; }

.topbar { display: none; }
.main { padding: 36px clamp(16px, 4vw, 56px) 72px; }
.page { max-width: 980px; margin: 0 auto; }
.page.wide { max-width: 1120px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 8px; }
.eyebrow i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; margin: 0 0 12px; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 30px 0 10px; text-wrap: balance; }
.lead { font-size: 18px; color: var(--muted); margin: 0 0 22px; max-width: 65ch; }
p { max-width: 68ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.grid { display: grid; gap: 14px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.path { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 6px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.path span { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 9px; font-family: var(--font-mono); font-size: 13px; }
.path b { color: var(--muted); font-weight: 400; }
.path-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 6px; }

ol.do { list-style: none; counter-reset: s; padding: 0; margin: 0; display: grid; gap: 10px; }
ol.do li { counter-increment: s; position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px 12px 52px; max-width: 70ch; }
ol.do li::before { content: counter(s); position: absolute; left: 14px; top: 12px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.ui { font-family: var(--font-mono); font-size: 13.5px; background: var(--accent-soft); border-radius: 5px; padding: 1px 7px; white-space: nowrap; }

.checks { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; max-width: 70ch; }
.checks label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; flex: 1; min-width: 0; }
.checks input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--ok); flex: none; }
.checks input:checked + span { color: var(--muted); text-decoration: line-through; }
.checks .check-row { display: flex; gap: 8px; align-items: stretch; }
.checks .check-row > .btn { align-self: center; flex: none; }

.attn { background: var(--warn-soft); border-left: 4px solid var(--warn); border-radius: 8px; padding: 12px 16px; max-width: 70ch; }
.attn ul { margin: 0; padding-left: 18px; }
.attn li { margin: 2px 0; }
.attn strong { color: var(--warn); }
.todo { border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px 14px; color: var(--muted); font-size: 14px; max-width: 70ch; }

.finish { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-top: 30px; padding: 16px 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 10px; cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink); display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #04152b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #04152b; } }
.btn.done { background: var(--ok); border-color: var(--ok); color: #fff; }
:root[data-theme="dark"] .btn.done { color: #04152b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.done { color: #04152b; } }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 15px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--bg); }
tr:last-child td { border-bottom: 0; }
.tablewrap { overflow-x: auto; }
dl.gloss { display: grid; gap: 10px; margin: 0; }
dl.gloss > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; max-width: 70ch; }
dl.gloss dt { font-weight: 600; font-family: var(--font-mono); font-size: 14px; }
dl.gloss dd { margin: 2px 0 0; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.phase-map { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin: 36px 0 18px; }
.phase-map a, .phase-map .phase-card {
  position: relative; text-decoration: none; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-top: 5px solid var(--c); border-radius: 14px;
  padding: 16px 16px 18px; display: block; min-height: 100%;
}
.phase-map a:hover { border-color: var(--c); }
.phase-map .phase-card.locked { opacity: .78; cursor: default; }
.phase-map .phase-card.locked:hover { opacity: 1; border-color: var(--c); }
.phase-map .lock-ico {
  position: absolute; top: 14px; right: 14px; width: 22px; height: 22px;
  color: var(--ink); display: block; flex: none; opacity: .85;
}
.phase-map .lock-row {
  display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 600;
}
.phase-map .lock-row svg { width: 15px; height: 15px; display: block; color: var(--warn); }
.phase-map .lock-tip {
  position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%) translateY(4px);
  background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; letter-spacing: .02em;
  padding: 5px 10px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
}
.phase-map .lock-tip::after {
  content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
  border: 6px solid transparent; border-top-color: var(--ink);
}
.phase-map .phase-card.locked:hover .lock-tip,
.phase-map .phase-card.locked:focus-within .lock-tip {
  opacity: 1; transform: translateX(-50%) translateY(0);
}
.phase-map small { color: var(--muted); display: block; line-height: 1.4; }
.phase-map strong { font-family: var(--font-display); font-size: 17px; display: block; margin: 6px 0 8px; padding-right: 22px; }
.meet-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 8px 0 18px; }
.meet-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 20px 18px;
  display: grid; gap: 10px; min-height: 100%;
}
.meet-card.confirmed { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ok) 18%, transparent); }
.meet-card .when { font-family: var(--font-mono); font-size: 14px; color: var(--accent); font-weight: 600; }
.meet-card .meet-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0; line-height: 1.2; }
.meet-card .meet-body { margin: 0; color: var(--muted); font-size: 15px; }
.meet-card .meet-out { margin: 0; font-size: 14px; }
.meet-card .tag {
  justify-self: start; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent);
}
.meet-card.confirmed .tag { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.unlock-box {
  max-width: 460px; margin: 10px 0 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; padding: 20px; display: grid; gap: 12px;
}
.unlock-box label { font-size: 13px; font-weight: 600; color: var(--muted); }
.unlock-box input[type="password"], .unlock-box input[type="text"] {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
.unlock-box .err { color: #c0392b; font-size: 14px; margin: 0; min-height: 1.2em; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: min(320px, 88vw); z-index: 20; transform: translateX(-100%); visibility: hidden; transition: transform .2s, visibility 0s .2s; box-shadow: 0 0 40px rgba(0,0,0,.25); }
  .side.open { transform: none; visibility: visible; transition: transform .2s; }
  .scrim.on { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 15; }
  .topbar { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .topbar strong { font-family: var(--font-display); }
  .grid.two, .phase-map, .meet-grid { grid-template-columns: 1fr; }
  .main { padding-top: 22px; }
}

.brandrow { display: flex; align-items: center; gap: 12px; margin: 0 4px 16px; }
.logo-chip { display: flex; flex: none; background: #fff; border-radius: 12px; padding: 8px 10px; border: 1px solid var(--line); }
.logo-chip img { height: 84px; width: auto; display: block; }
.brandtitle { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.2; display: block; }
.brandsub { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; margin-top: 4px; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 50; background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 8px; }
.skip:focus { left: 8px; }
.main:focus { outline: none; }
.save-note { margin: -10px 6px 14px; font-size: 12.5px; color: var(--muted); }
.scrim { display: none; }
.hero { display: flex; align-items: center; gap: 22px; margin-bottom: 28px; }
.hero img { width: 132px; height: auto; flex: none; animation: digi-float 3.2s ease-in-out infinite; transform-origin: center bottom; will-change: transform; }
.hero > div { min-width: 0; }
@keyframes digi-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.links { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
.btn .clip, .clip-ico { width: 15px; height: 15px; flex: none; display: inline-block; vertical-align: -2px; margin-right: 4px; }
.btn.has-clip { display: inline-flex; align-items: center; gap: 2px; }
.guide { display: flex; gap: 12px; align-items: center; margin: 0 0 18px; }
.guide img { width: 44px; height: auto; }
.cred { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; max-width: 70ch; display: grid; gap: 10px; }
.cred a { word-break: break-all; font-family: var(--font-mono); font-size: 14px; }
.cred-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.cred-row label { font-size: 13px; font-weight: 600; color: var(--muted); }
.cred-row input { width: 100%; min-width: 0; font-family: var(--font-mono); font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.cred-row .btn { padding: 7px 12px; font-size: 14px; }
.cred small { color: var(--muted); }
.eye svg { width: 20px; height: 20px; display: block; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 900px) { .hero { flex-direction: column; align-items: flex-start; } .cred-row { grid-template-columns: 1fr auto auto; } .cred-row label { grid-column: 1 / -1; } }
.celebrate {
  position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
  padding: 24px; background: color-mix(in srgb, var(--bg) 72%, transparent);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  overflow: hidden;
}
.celebrate-card {
  position: relative; z-index: 2; width: min(560px, 100%);
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 28px 24px 24px; text-align: center; box-shadow: 0 18px 50px color-mix(in srgb, var(--ink) 18%, transparent);
  animation: celebrate-in .45s ease-out; max-height: min(92vh, 920px); overflow: auto;
}
.celebrate-card.wide { width: min(720px, 100%); }
.celebrate-card > img.mascot { width: 108px; height: auto; margin: 0 auto 10px; display: block; animation: digi-float 3.2s ease-in-out infinite; }
.celebrate-card h2 { font-family: var(--font-display); font-size: clamp(26px, 4vw, 34px); line-height: 1.15; margin: 0 0 10px; text-wrap: balance; }
.celebrate-card p { margin: 0 auto 18px; color: var(--muted); max-width: 42ch; }
.celebrate-card .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.cert-form { display: grid; gap: 12px; text-align: left; margin: 0 auto 8px; max-width: 420px; }
.cert-form label { font-size: 13px; font-weight: 600; color: var(--muted); }
.cert-form input[type="text"] {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
.cert-preview-wrap {
  margin: 8px auto 14px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  background: #0b1220; max-width: 100%;
}
.cert-preview-wrap canvas { display: block; width: 100%; height: auto; }
#confettiCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
@keyframes celebrate-in {
  from { opacity: 0; transform: translateY(16px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .hero img, .celebrate-card > img.mascot { animation: none !important; }
  .celebrate-card { animation: none !important; }
}
</style>
</head>
<body>
<a class="skip" id="skipLink" href="#conteudo">Ir para o conteúdo</a>
<div class="scrim" id="scrim"></div>
<div class="topbar">
  <button class="btn" id="menuBtn" aria-expanded="false" aria-controls="side">Menu</button>
  <strong>Livros Digitais novos do SAE</strong>
</div>
<div class="app">
  <aside class="side" id="side" aria-label="Menu do tutorial">
    <a class="brandrow" href="#visao-geral" style="text-decoration:none;color:inherit" aria-label="SAE Digital, início do tutorial">
      <span class="logo-chip"><img src="sae-logo.png" alt="SAE Digital"></span>
      <span><span class="brandtitle">Livros Digitais novos</span><span class="brandsub">Tutorial de criação, do PDF ao pagamento</span></span>
    </a>
    <div class="progress" aria-live="polite">
      <div class="progress-top"><span>Seu progresso</span><span id="progText">0 de 13 passos</span></div>
      <div class="bar"><span id="progBar"></span></div>
    </div>
    <p class="save-note" id="saveNote"></p>
    <nav class="nav" id="nav" aria-label="Passos do tutorial"></nav>
    <button class="reset" id="resetBtn" type="button">Limpar meu progresso</button>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<script>
(function () {
  var PHASES = [
    { id: 1, name: "Preparação", range: "Passos 1 a 3", color: "var(--p1)", blurb: "Buscar o PDF, separar por disciplina e deixar tudo no lugar certo do Drive." },
    { id: 2, name: "Produção", range: "Passos 4 a 8", color: "var(--p2)", blurb: "Escolher o capítulo e gerar o HTML com o DIA LD." },
    { id: 3, name: "Validação", range: "Passos 9 a 11", color: "var(--p3)", blurb: "Conferir PDF contra HTML, passar pelo cotejo e aplicar ajustes." },
    { id: 4, name: "Publicação e pagamento", range: "Passos 12 e 13", color: "var(--p4)", blurb: "Subir no Bigodão, registrar o link e liberar o pagamento." }
  ];

  var STEPS = [
    {
      n: 1, phase: 1, title: "Baixar o PDF do professor no Assets",
      tool: "Assets", access: "Acesso ao Assets", links: [["Abrir o Assets", "https://arco-dam.eos.woodwing.cloud/app/#/ssoOIDCLogin"]],
      lead: "Tudo começa pelo PDF do livro do professor, na versão final da gráfica.",
      path: ["Segmento", "Ano", "Ano e Volume", "PDF_FINAL", "PDF_GRAFICA", "Livro do professor"],

  var confettiRaf = 0;
  var confettiOnResize = null;
  function stopConfetti() {
    if (confettiRaf) cancelAnimationFrame(confettiRaf);
    confettiRaf = 0;
    if (confettiOnResize) {
      window.removeEventListener("resize", confettiOnResize);
      confettiOnResize = null;
    }
    var c = document.getElementById("confettiCanvas");
    if (c) c.remove();
  }

  function burstConfetti(host) {
    stopConfetti();
    if (!host) return;
    var canvas = document.createElement("canvas");
    canvas.id = "confettiCanvas";
    host.insertBefore(canvas, host.firstChild);
    var ctx = canvas.getContext("2d");
    if (!ctx) return;
    var parts = [];
    var colors = ["#0a63d1", "#5aa9ff", "#7f2a8e", "#d08ae0", "#1d7a4a", "#5fd08f", "#fbb633", "#ff6b6b", "#ff9f43", "#ffffff"];
    function resize() {
      var w = host.clientWidth || window.innerWidth;
      var h = host.clientHeight || window.innerHeight;
      canvas.width = Math.max(1, w);
      canvas.height = Math.max(1, h);
    }
    confettiOnResize = resize;
    resize();
    window.addEventListener("resize", resize);
    function addPiece(x, y, burst) {
      var a = burst ? Math.random() * Math.PI * 2 : (Math.PI / 2 + (Math.random() - 0.5) * 0.9);
      var sp = burst ? (8 + Math.random() * 12) : (2 + Math.random() * 4);
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (burst ? 6 : 0),
        g: 0.15 + Math.random() * 0.1,
        w: 8 + Math.random() * 8,
        h: 10 + Math.random() * 10,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.35,
        color: colors[(Math.random() * colors.length) | 0],
        life: 1
      });
    }
    function spawnBurst(x, y, count) {
      for (var i = 0; i < count; i++) addPiece(x, y, true);
    }
    function spawnRain(count) {
      for (var i = 0; i < count; i++) addPiece(Math.random() * canvas.width, -20 - Math.random() * 40, false);
    }
    spawnBurst(canvas.width * 0.5, canvas.height * 0.42, 120);
    spawnBurst(canvas.width * 0.18, canvas.height * 0.28, 70);
    spawnBurst(canvas.width * 0.82, canvas.height * 0.28, 70);
    spawnRain(80);
    var frames = 0;
    function tick() {
      if (!document.body.contains(canvas)) { confettiRaf = 0; return; }
      frames++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (frames % 8 === 0 && frames < 160) {
        spawnBurst(Math.random() * canvas.width, canvas.height * (0.12 + Math.random() * 0.3), 36);
        spawnRain(18);
      }
      for (var i = parts.length - 1; i >= 0; i--) {
        var p = parts[i];
        p.vy += p.g;
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.99;
        p.rot += p.vr;
        p.life -= 0.0045;
        if (p.life <= 0 || p.y > canvas.height + 60) { parts.splice(i, 1); continue; }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (parts.length || frames < 180) confettiRaf = requestAnimationFrame(tick);
      else stopConfetti();
    }
    confettiRaf = requestAnimationFrame(tick);
  }

    words.forEach(function (w) {

      if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
      else line = test;
    });
    if (line) lines.push(line);
    return lines;
  }

  function clearBlackBackground(img, threshold) {
    var c = document.createElement("canvas");
    var w = img.naturalWidth || img.width;
    var h = img.naturalHeight || img.height;
    c.width = w;
    c.height = h;
    var cx = c.getContext("2d");
    cx.drawImage(img, 0, 0);
    var data = cx.getImageData(0, 0, w, h);
    var d = data.data;
    var seen = new Uint8Array(w * h);
    var stack = [];
    function dark(i) { return d[i] < threshold && d[i + 1] < threshold && d[i + 2] < threshold && d[i + 3] > 8; }
    function push(x, y) {
      if (x < 0 || y < 0 || x >= w || y >= h) return;
      stack.push(y * w + x);
    }
    for (var x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
    for (var y = 0; y < h; y++) { push(0, y); push(w - 1, y); }
    while (stack.length) {
      var p = stack.pop();
      if (seen[p]) continue;
      seen[p] = 1;
      var i = p * 4;
      if (!dark(i)) continue;
      d[i + 3] = 0;
      var px = p % w, py = (p / w) | 0;
      push(px + 1, py); push(px - 1, py); push(px, py + 1); push(px, py - 1);
    }
    cx.putImageData(data, 0, 0);
    return c;
  }

  function getClearAsset(key, img) {
    if (!img) return null;
    var cacheKey = key + "Clear";
    if (!certAssets[cacheKey]) certAssets[cacheKey] = clearBlackBackground(img, 28);
    return certAssets[cacheKey];
  }

  function drawCertificate(canvas, personName) {
    var W = 1600, H = 1132;
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext("2d");
    var name = (personName || "").trim() || "Seu nome aqui";
    var today = new Date();
    var dateStr = today.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });
    var logo = getClearAsset("logo", certAssets.logo);
    var digi = getClearAsset("digi", certAssets.digi);

    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "#f7f1e6");
    g.addColorStop(0.55, "#fffdf8");
    g.addColorStop(1, "#e8eef8");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "#0a63d1";
    ctx.lineWidth = 10;
    ctx.strokeRect(36, 36, W - 72, H - 72);
    ctx.strokeStyle = "#7f2a8e";
    ctx.lineWidth = 3;
    ctx.strokeRect(52, 52, W - 104, H - 104);
    ctx.strokeStyle = "#f0b429";
    ctx.lineWidth = 2;
    ctx.strokeRect(64, 64, W - 128, H - 128);

    function corner(x, y, flipX, flipY) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
      ctx.strokeStyle = "#f0b429";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 70);
      ctx.lineTo(0, 0);
      ctx.lineTo(70, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(28, 28, 10, 0, Math.PI * 2);
      ctx.fillStyle = "#7f2a8e";
      ctx.fill();
      ctx.restore();
    }
    corner(88, 88, false, false);
    corner(W - 88, 88, true, false);
    corner(88, H - 88, false, true);
    corner(W - 88, H - 88, true, true);

    var y = 108;
    if (logo) {
      var lw = 150, lh = lw * (logo.height / logo.width);
      ctx.drawImage(logo, (W - lw) / 2, y, lw, lh);
      y += lh + 36;
    } else {
      y = 150;
    }

    ctx.textAlign = "center";
    ctx.fillStyle = "#0a63d1";
    ctx.font = "700 26px \"IBM Plex Sans\", sans-serif";
    ctx.fillText("CERTIFICADO DE CONCLUSÃO", W / 2, y);
    y += 58;

    ctx.fillStyle = "#15202b";
    ctx.font = "700 52px \"Bricolage Grotesque\", \"Segoe UI\", sans-serif";
    ctx.fillText("Livros Digitais novos do SAE", W / 2, y);
    y += 56;

    ctx.fillStyle = "#5a6877";
    ctx.font = "500 26px \"IBM Plex Sans\", sans-serif";
    ctx.fillText("Certificamos que", W / 2, y);
    y += 70;

    ctx.fillStyle = "#7f2a8e";
    ctx.font = "700 64px \"Bricolage Grotesque\", \"Segoe UI\", sans-serif";
    var nameLines = wrapCanvasText(ctx, name, W - 320).slice(0, 2);
    nameLines.forEach(function (ln, i) {
      if (i) y += 68;
      ctx.fillText(ln, W / 2, y);
    });
    y += 22;

    ctx.strokeStyle = "#cfd6de";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2 - 260, y);
    ctx.lineTo(W / 2 + 260, y);
    ctx.stroke();
    y += 44;

    ctx.fillStyle = "#15202b";
    ctx.font = "500 24px \"IBM Plex Sans\", sans-serif";
    var body = "concluiu todas as etapas do tutorial de criação dos Livros Digitais novos e está apta(o) a produzir capítulos — do PDF do professor à liberação do pagamento.";
    wrapCanvasText(ctx, body, W - 360).forEach(function (ln) {
      ctx.fillText(ln, W / 2, y);
      y += 34;
    });

    var sealY = H - 220;
    ctx.save();
    ctx.beginPath();
    ctx.arc(230, sealY, 78, 0, Math.PI * 2);
    ctx.fillStyle = "#0a63d1";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(230, sealY, 68, 0, Math.PI * 2);
    ctx.fillStyle = "#f0b429";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(230, sealY, 58, 0, Math.PI * 2);
    ctx.fillStyle = "#7f2a8e";
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.font = "700 18px \"IBM Plex Sans\", sans-serif";
    ctx.fillText("PODER DE", 230, sealY - 8);
    ctx.fillText("CRIAR LDs", 230, sealY + 18);
    ctx.restore();

    ctx.fillStyle = "#5a6877";
    ctx.font = "500 22px \"IBM Plex Sans\", sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("Emitido em " + dateStr, 350, sealY + 4);
    ctx.fillText("Tutorial interno · SAE Digital", 350, sealY + 36);

    if (digi) {
      var dw = 170, dh = dw * (digi.height / digi.width);
      ctx.drawImage(digi, W - 300, H - 300, dw, dh);
    }

    ctx.fillStyle = "#8a97a5";
    ctx.font = "500 16px \"IBM Plex Mono\", monospace";
    ctx.textAlign = "center";
    ctx.fillText("Documento simbólico de conclusão do tutorial · 13 passos · 4 fases", W / 2, H - 88);
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

      h += '<p class="path-label">Caminho</p><div class="path">' + s.path.map(function (p) { return "<span>" + esc(p) + "</span>"; }).join("<b>&rarr;</b>") + "</div><div style='height:18px'></div>";
    }
    h += "<h2 style='margin-top:6px'>O que fazer</h2><ol class='do'>" + s.doList.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ol>";
    if (s.cred) h += credBlock();
    h += "<h2>Confira antes de seguir</h2><ul class='checks'>";
    s.check.forEach(function (c, i) {
      var k = s.id + "-c" + i;
      h += '<li><label><input type="checkbox" data-k="' + k + '"' + (store.checks[k] ? " checked" : "") + "><span>" + esc(c) + "</span></label></li>";
    });
    h += "</ul>";
    if (s.attn && s.attn.length) {
      h += "<h2>Pontos de atenção</h2><div class='attn'><ul>" + s.attn.map(function (a) { return "<li>" + a + "</li>"; }).join("") + "</ul></div>";
    }
    if (s.todo) { h += "<div style='height:14px'></div><div class='todo'>A completar: " + esc(s.todo) + "</div>"; }
    var d = !!store.done[s.id];
    var nChk = s.check.filter(function (c, i) { return store.checks[s.id + "-c" + i]; }).length;
    var hasNext = s.n < STEPS.length;
    h += '<div class="finish"><span>' + (d ? "Passo concluído." : "Conferências feitas: " + nChk + " de " + s.check.length) + '</span><button type="button" class="btn ' + (d ? "done" : "primary") + '" id="doneBtn">' + (d ? "Concluído (clique para desfazer)" : (hasNext ? "Concluir e ir para o próximo passo" : "Concluir passo")) + "</button></div>";
    h += pager(s.id) + "</div>";
    return h;
  }

  function render() {
    var id = (location.hash || "").replace("#", "");
    if (ORDER.indexOf(id) < 0) id = "visao-geral";
    var locked = isLockedRoute(id);
    var step = !locked ? STEPS.filter(function (s) { return s.id === id; })[0] : null;
    var html;
    if (locked) html = pageUnlockGate(id);
    else if (step) html = pageStep(step);
    else if (id === "visao-geral") html = pageVisao();
    else if (id === "acessos") html = pageAcessos();
    else if (id === "encontros") html = pageEncontros();
    else html = pageGlossario();
    mainEl.innerHTML = html;
    buildNav(locked ? id : (step ? step.id : id));
    sideEl.classList.remove("open");
    document.getElementById("menuBtn").setAttribute("aria-expanded", "false");
    var names = { "visao-geral": "Visão geral", acessos: "Acessos e ferramentas", encontros: "Plano de encontros", glossario: "Glossário" };
    document.title = (locked ? "Módulo bloqueado" : (step ? "Passo " + step.n + ": " + step.title : names[id])) + " · Livros Digitais novos do SAE";
    if (step) { store.last = step.id; save(); }
    document.getElementById("scrim").classList.remove("on");
    window.scrollTo(0, 0);
    if (window.__navd) { mainEl.focus({ preventScroll: true }); }
    window.__navd = true;
    Array.prototype.forEach.call(mainEl.querySelectorAll("input[type=checkbox]"), function (cb) {
      cb.addEventListener("change", function () { store.checks[cb.getAttribute("data-k")] = cb.checked; save(); });
    });
    var unlockBtn = document.getElementById("unlockBtn");
    if (unlockBtn) {
      var unlockInput = document.getElementById("unlockCode");
      var unlockErr = document.getElementById("unlockErr");
      var tryUnlock = function () {
        var typed = (unlockInput.value || "").trim();
        if (typed.toLowerCase() === UNLOCK_CODE.toLowerCase()) {
          store.unlocked = true;
          save();
          location.hash = id;
          render();
          return;
        }
        unlockErr.textContent = "Senha incorreta. Ela é passada no Encontro 1.";
        unlockInput.focus();
      };
      unlockBtn.addEventListener("click", tryUnlock);
      unlockInput.addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
      unlockInput.focus();
    }
    var btn = document.getElementById("doneBtn");
    if (btn && step) {
      btn.addEventListener("click", function () {
        var wasDone = !!store.done[step.id];
        store.done[step.id] = !wasDone;
        save();
        if (!wasDone && allStepsDone()) {
          render();
          showCelebrate();
          return;
        }
        if (store.done[step.id]) {
          var i = ORDER.indexOf(step.id), nx = ORDER[i + 1];
          if (nx) { location.hash = nx; return; }
        }
        render();
      });
    }
  }

  function closeMenu() {
    sideEl.classList.remove("open");
    document.getElementById("scrim").classList.remove("on");
    document.getElementById("menuBtn").setAttribute("aria-expanded", "false");
  }
  document.getElementById("menuBtn").addEventListener("click", function () {
    var open = sideEl.classList.toggle("open");
    document.getElementById("scrim").classList.toggle("on", open);
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.getElementById("skipLink").addEventListener("click", function (e) { e.preventDefault(); mainEl.focus(); });
  document.getElementById("scrim").addEventListener("click", closeMenu);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.getElementById("celebrate")) { closeCelebrate(); return; }
    if (e.key === "Escape" && sideEl.classList.contains("open")) { closeMenu(); document.getElementById("menuBtn").focus(); }
  });
  document.getElementById("resetBtn").addEventListener("click", function () {
    if (!window.__confirmReset) {
      window.__confirmReset = true;
      this.textContent = "Clique de novo para confirmar";
      var b = this;
      setTimeout(function () { window.__confirmReset = false; b.textContent = "Limpar meu progresso"; }, 4000);
      return;
    }
    closeCelebrate();
    var keepUnlocked = !!store.unlocked;
    store = { done: {}, checks: {}, unlocked: keepUnlocked };
    save();
    window.__confirmReset = false;
    this.textContent = "Limpar meu progresso";
    render();
  });
  window.addEventListener("hashchange", render);
  load();
  render();
})();
</script>
</body>
</html>
